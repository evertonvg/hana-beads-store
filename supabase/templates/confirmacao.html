<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu e-mail</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #14121f;
      color: #ede9ff;
      font-family: &quot;Courier New&quot;, monospace;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #14121f"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #2c2840; border: 4px solid #ede9ff"
          >
            <tr>
              <td style="padding: 28px">
                <p
                  style="
                    margin: 0 0 12px;
                    font-size: 12px;
                    font-weight: bold;
                    color: #ffd23f;
                    letter-spacing: 1px;
                  "
                >
                  NEW PLAYER
                </p>
                <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.4; color: #ede9ff">
                  Confirme seu e-mail
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #c9c4e3">
                  Falta só um passo para liberar sua conta na Pixel Perfect Artesanato. Toque no
                  botão para confirmar o e-mail e entrar.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
                    style="
                      display: inline-block;
                      padding: 16px 22px;
                      background: #ff5fae;
                      color: #14121f;
                      font-size: 14px;
                      font-weight: bold;
                      text-decoration: none;
                      border: 3px solid #14121f;
                    "
                    >CONFIRMAR E-MAIL ›</a
                  >
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #a9a3c9">
                  O link funciona uma vez só. Se você não criou uma conta, pode ignorar este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
