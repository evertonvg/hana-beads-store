name: Deploy database migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**"]

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when the cloud project does not exist yet
        if: env.SUPABASE_PROJECT_REF == ''
        run: echo "::warning::SUPABASE_PROJECT_REF is not set (cloud project not created yet); skipping the migrations deploy."
      - uses: actions/checkout@v4
        if: env.SUPABASE_PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_PROJECT_REF != ''
        with:
          version: 2.122.0 # keep equal to the `supabase` devDependency
      - name: Link and push migrations
        if: env.SUPABASE_PROJECT_REF != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
