name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Separate job: the mock E2E and the Supabase E2E share `.next`.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0 # keep equal to the `supabase` devDependency
      - run: supabase start
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts
      # Keys are read at runtime from `supabase status`; no secrets needed.
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:supabase
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
